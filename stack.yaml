version: '3.8'

services:
  valcapelli-frontend:
    image: manoelfg123/frt-valcapelli:latest
    
    # === DNS FIX CONFIGURATION ===
    dns:
      - 127.0.0.11    # DNS interno do Docker (forçar uso)
      - 8.8.8.8       # DNS público como fallback
    dns_search:
      - .             # Buscar no domínio atual primeiro
    
    ports:
      - "3000"
    
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      # === RESTART POLICY MELHORADA ===
      restart_policy:
        condition: on-failure
        delay: 15s        # Aguardar 15s antes de reiniciar
        max_attempts: 5
        window: 300s      # Janela de 5 minutos para contabilizar falhas
      # === RESOURCE LIMITS ===
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.10'   # Garantindo pelo menos 0.25 vCPU
          memory: 64M   # Garantindo pelo menos 128MB
      placement:
        constraints: []
      labels:
        traefik.enable: 'true'
        traefik.http.routers.valcapelli.rule: Host(`valcapelli.iaautomation-dev.com.br`)
        traefik.http.routers.valcapelli.service: valcapelli
        traefik.http.services.valcapelli.loadbalancer.server.port: '3000'
        traefik.http.routers.valcapelli.entrypoints: websecure
        traefik.http.routers.valcapelli.tls: 'true'
        traefik.http.routers.valcapelli.tls.certresolver: letsencryptresolver
        traefik.http.middlewares.valcapelli-compress.compress: 'true'
        traefik.http.routers.valcapelli.middlewares: valcapelli-compress
    
    # === ENVIRONMENT VARIABLES (runtime) ===
    environment:
      - GRAPH_ID=valcapelli
      - LANGSMITH_API_KEY=sk-psXRIq3r5RqA38W2BE7EnJnFXzbQGIQeIg_kpTivY4w
      - LANGSMITH_API_URL=https://langgraph-val.iaautomation-dev.com.br
    
    # === HEALTH CHECK ===
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # === NETWORK COM ALIAS (força refresh) ===
    networks:
      - network_public

networks:
  network_public:
    external: true
    name: network_public
